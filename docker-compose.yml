services:
  postgres:
    image: postgres:16
    container_name: damper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-damper_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-damper_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - damper-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-damper_user} -d ${POSTGRES_DB:-damper_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  damper-postgres-data:
